[package]
name = "opsx-build"
version = "0.27.0"
edition = "2024"
description = "Unattended OpenSpec build orchestrator for coding agents"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.16"
crossterm = "0.29"
indicatif = "0.18"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
ureq = { version = "2.12", default-features = false, features = ["json"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
