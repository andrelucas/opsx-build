[package]
name = "opsx-build"
version = "0.24.0"
edition = "2024"
description = "Unattended OpenSpec build orchestrator for Claude Code"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.16"
crossterm = "0.29"
indicatif = "0.18"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }
