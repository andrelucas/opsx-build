# Copy to ~/.config/opsx-build/config.toml and adjust for your environment.

max_verify_retries = 3
max_output_retries = 3
permission_mode = "auto"

# Development shortcut: skip proposal commits but retain final completion
# commits and the private pre-Propose rollback baseline.
# yolo = true

claude_command = "omlx launch claude"
claude_model = "qwen3.6-35b-a3b"

# Optional token policies (binary k/m suffixes are accepted).
# auto_compact_window = "192k"
# max_output_tokens = "8k"

# Optional live Claude output: "activity", "full", or "raw".
# stream_claude = "activity"

# Uncomment these only when automatic project discovery does not match your
# installed OpenSpec delivery profile.
# explore_command = "/explore-unattended"
# propose_command = "/propose-unattended"
# apply_command = "/openspec-apply-change"
# verify_command = "/openspec-verify-change"
# archive_command = "/openspec-archive-change"
