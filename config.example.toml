# Copy to ~/.config/opsx-build/config.toml and adjust for your environment.

max_verify_retries = 3
max_output_retries = 3
max_provider_retries = 10
permission_mode = "auto"

# Development shortcut: skip proposal commits but retain final completion
# commits and the private pre-Propose rollback baseline.
# yolo = true

claude_command = "omlx launch claude"
claude_model = "qwen3.6-35b-a3b"

# Optional token policies (binary k/m suffixes are accepted).
# auto_compact_window = "192k"
# max_output_tokens = "8k"

# Optional live Claude output: "activity", "full", or "raw".
# stream_claude = "activity"

# Backend-selectable named connections can replace the legacy flat Claude
# fields above. Claude remains the default when `backend` is omitted.
# worker_connection = "opencode-local"
# frontier_connection = "anthropic"
#
# [connections.opencode-local]
# backend = "opencode"
# command = "opencode"
# model = "openrouter/qwen/qwen3.6-35b-a3b"
#
# [connections.anthropic]
# backend = "claude"
# command = "claude"
#
# A Codex connection may select a named permission profile from
# ~/.codex/config.toml. This lets App Server inherit cache, network, and
# loopback policy without opsx-build replacing it with an inline sandbox.
# [connections.codex-worker]
# backend = "codex"
# permission_profile = "opsx-build"
# For Codex providers that reject enforced stage-result JSON schemas:
# structured_output = false
# To use OpenRouter through Codex, configure a Codex model provider and select
# it in the command; Claude's ANTHROPIC_* environment does not route Codex.
# See README.md, "Using Codex with OpenRouter", for both configuration files.

# Uncomment these only when automatic project discovery does not match your
# installed OpenSpec delivery profile.
# explore_command = "/explore-unattended"
# propose_command = "/propose-unattended"
# apply_command = "/openspec-apply-change"
# verify_command = "/openspec-verify-change"
# archive_command = "/openspec-archive-change"
