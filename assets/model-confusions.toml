# Known, observed model/version failure modes. Add another [[confusion]] entry
# here to extend both the unattended prompt guidance and the PreToolUse guard.

[[confusion]]
id = "qwen3.6-openspec-duplicated-s"
observed_with = ["Qwen3.6"]
forbidden_literal = "opensspec"
guidance = "Spell the product name exactly `OpenSpec` and its CLI executable, paths, and Git subject prefix exactly `openspec`. The canonical spelling is `open` + `spec`: exactly one `s` and two `p` characters. Never insert an additional `s` at the word boundary, and check this before repository writes and Git commits. The guard is authoritative: after a rejection, correct the spelling and retry the same operation. Never bypass, disable, alias, encode, concatenate, split, or route around the guard."
diagnostic = "Known Qwen3.6-induced failure mode: the attempted spelling has a duplicated `s` at the Open/Spec boundary (`open` + `sspec`). The brand is `OpenSpec`; its CLI, paths, and Git subject prefix are `openspec` (`open` + `spec`: exactly one `s` and two `p` characters). Correct the spelling and retry the same operation. Do not preserve or quote the misspelling in repository content or Git history. Do not bypass, disable, alias, encode, concatenate, split, or use another tool to evade this guard; those are manifestations of the same incident, not valid workarounds."
