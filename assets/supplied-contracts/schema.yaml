name: opsx-supplied-contracts
version: 2
description: Plan and implement changes under supplied contracts.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Map supplied requirements to this slice's implementation work.
    template: proposal.md
    instruction: |
      Read the governing original contracts and component scope before planning.
      Identify the supplied requirements this change implements using Markdown
      links under ## Supplied requirements. Use paths relative to proposal.md or
      absolute paths; include a heading anchor or exact requirement ID where available.
      Explain the change, affected dependencies and regression risks. Reference
      inherited coverage through the assignment's Planning references instead of
      enumerating every preserved requirement again. Keep direct original links
      for the requirements relevant to the change.
      Do not write replacement requirements or spec deltas. Explain scope and impact
      briefly; explain material internal choices here and put steps in tasks.md.
      For substantial decisions, add design.md as an optional supporting document.
      A separate design is not a completion condition.
      Correct any contradictory generated agenda while keeping its slice identity.
      Never edit supplied contracts or maintainer-owned acceptance expectations.
    requires: []
  - id: tasks
    generates: tasks.md
    description: Coherent, testable implementation steps and contract checks.
    template: tasks.md
    instruction: |
      Read the original requirements referenced by the proposal and any optional design.
      Write checkboxes with numbered tasks, e.g. - [ ] 1.1 Implement ... .
      Group implementation and checks into practical testable steps within this
      change; do not subdivide merely because several steps are identifiable.
      Reference supplied acceptance scenarios and preserve their expected results.
      Add relevant implementation tests, including failure paths. Do not invent
      substitute acceptance expectations or copy requirements into a new spec.
      Include all project-required delivery reports as ordinary implementation
      tasks. Final acceptance has no separate Apply stage to finish them later.
    requires: [proposal]
apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read the original contracts linked by the proposal before implementing.
    Work through tasks in testable steps, mark completed checkboxes, and run
    relevant checks. Preserve supplied contracts and acceptance expectations.
    Correct mistaken derived plans, implementation and tests together. No spec
    deltas are required; this workflow implements existing supplied requirements.
